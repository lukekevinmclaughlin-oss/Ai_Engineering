name: Ai_Engineering

options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.lukemclaughlin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Ai_Engineering:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Ai_Engineering
        excludes:
          - Resources/**
      - path: Ai_Engineering/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Ai_Engineering
        PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.aiengineering
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ai_Engineering
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Ai_Engineering can connect to a local model server only when you enable a connected tutor provider.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1,2"

  Ai_EngineeringTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Ai_EngineeringTests
    dependencies:
      - target: Ai_Engineering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.aiengineering.tests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Ai_Engineering.app/Contents/MacOS/Ai_Engineering"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/Ai_Engineering.app/Ai_Engineering"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/Ai_Engineering.app/Ai_Engineering"

schemes:
  Ai_Engineering:
    build:
      targets:
        Ai_Engineering: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Ai_Engineering
      targets:
        - Ai_EngineeringTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
